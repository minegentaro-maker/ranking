<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かっこよさランキング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* 学内の大画面ランキング（pages/ranking.py）と同じ「文化祭のポスター風」（2026-11-02 変更。前の紺の配色版は ../index.html.bak_20261102）。
     黄色の水玉の背景＋太い黒の縁取り＋ずらした影、見出しと数字は Dela Gothic One。動画は出さない。
     ランキングは全日程を通したもの。ページ全体はスクロールせず、ランキングの枠（.win）の中だけスクロールする。
     見出しの英字と「さっき走った人」のカードは、増田さんの指示で外した（2026-11-01）。
     開いたときに増田さん作の読み込み画面（走るだいごくん＝runner.gif）を出してからランキングを見せる。
     大きさは画面幅に合わせ、PCで開いても幅500pxまでで止める（--u = 画面幅の1%、最大5px） */
  :root { --ink: #111111; --yellow: #ffe14d; --dot: #f2c500; --red: #e8352b; --blue: #2f6fd6; --green: #1aa35a;
          --u: min(1vw, 5px); --bd: calc(.9 * var(--u)); color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background-color: var(--yellow);
         background-image: radial-gradient(var(--dot) calc(.5 * var(--u)), transparent calc(.5 * var(--u)));
         background-size: calc(5 * var(--u)) calc(5 * var(--u));
         font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; color: var(--ink); }
  .dg, .title, .score, .badge, .meta b, .cta .big { font-family: "Dela Gothic One", "Noto Sans JP", "Hiragino Sans", sans-serif; font-weight: 400; }
  .rk { max-width: 500px; height: 100vh; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column;
        padding: calc(6 * var(--u)) calc(5 * var(--u)) calc(4 * var(--u)); }
  .rk > * { flex: none; }
  /* ランキングを表示する枠。残りの高さをすべて使い、中だけスクロールする */
  .win { flex: 1 1 auto; min-height: calc(40 * var(--u)); overflow-y: auto; overscroll-behavior: contain;
         -webkit-overflow-scrolling: touch; background: #fff6c2; border: var(--bd) solid var(--ink);
         box-shadow: calc(1.4 * var(--u)) calc(1.4 * var(--u)) 0 var(--ink);
         padding: calc(2.4 * var(--u)) calc(3.4 * var(--u)) calc(2.4 * var(--u)) calc(2.2 * var(--u)); }
  .win .empty { border: none; background: none; box-shadow: none; }

  .top { margin-bottom: calc(6 * var(--u)); display: flex; flex-direction: column; align-items: flex-start; gap: calc(5 * var(--u)); }
  .title { font-size: calc(8.4 * var(--u)); line-height: 1.15; white-space: nowrap; margin: 0; color: #fff;
           background: var(--ink); padding: calc(.5 * var(--u)) calc(3.6 * var(--u)) calc(2 * var(--u));
           transform: rotate(-2deg); box-shadow: calc(1.6 * var(--u)) calc(1.6 * var(--u)) 0 var(--red); }
  .title em { font-style: normal; color: var(--yellow); }
  .line { display: none; }
  .meta { background: #fff; border: var(--bd) solid var(--ink); box-shadow: calc(1.2 * var(--u)) calc(1.2 * var(--u)) 0 var(--ink);
          padding: calc(2 * var(--u)) calc(3.4 * var(--u)); font-size: calc(3.8 * var(--u)); font-weight: 900;
          line-height: 1.4; transform: rotate(1.5deg); }
  .meta b { font-size: calc(6.4 * var(--u)); color: var(--red); }
  .meta small { display: block; font-size: calc(3 * var(--u)); font-weight: 700; }

  .list { display: flex; flex-direction: column; gap: calc(2.6 * var(--u)); }
  .row { display: grid; grid-template-columns: calc(11 * var(--u)) 1fr auto; column-gap: calc(2.4 * var(--u)); align-items: center;
         height: calc(13 * var(--u)); background: #fff; border: var(--bd) solid var(--ink);
         box-shadow: calc(1.2 * var(--u)) calc(1.2 * var(--u)) 0 var(--ink); padding: 0 calc(2.4 * var(--u)) 0 0; }
  .row.new { border-color: var(--red); box-shadow: calc(1.2 * var(--u)) calc(1.2 * var(--u)) 0 var(--red); }
  .badge { height: 100%; display: flex; align-items: center; justify-content: center; font-size: calc(5.6 * var(--u));
           border-right: var(--bd) solid var(--ink); }
  .r1 .badge { background: var(--red); color: #fff; }
  .r2 .badge { background: var(--blue); color: #fff; }
  .r3 .badge { background: var(--green); color: #fff; }
  .name { font-size: calc(4.5 * var(--u)); font-weight: 900; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; min-width: 0; line-height: 1.2;
          display: flex; align-items: center; gap: calc(2 * var(--u)); }
  .name span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .newtag { flex: none; font-size: calc(2.6 * var(--u)); font-weight: 900; background: var(--red); color: #fff;
            padding: calc(.5 * var(--u)) calc(1.4 * var(--u)); letter-spacing: .1em; transform: rotate(-4deg); }
  .score { font-size: calc(5.6 * var(--u)); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
  .score small { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: .45em; margin-left: .2em; }
  .bar { display: none; }   /* 大画面と同じく点数のバーは出さない */

  .empty { background: #fff; border: var(--bd) solid var(--ink); padding: calc(12 * var(--u)) calc(5 * var(--u)); text-align: center;
           font-size: calc(5 * var(--u)); font-weight: 900; line-height: 1.7; }
  .empty span { display: block; font-size: calc(3.4 * var(--u)); font-weight: 700; }

  .side { display: flex; flex-direction: column; gap: calc(4 * var(--u)); margin-top: calc(5 * var(--u)); }
  .card { border: var(--bd) solid var(--ink); box-shadow: calc(1.6 * var(--u)) calc(1.6 * var(--u)) 0 var(--ink);
          padding: calc(4 * var(--u)) calc(5 * var(--u)); }
  .cta { background: var(--red); color: #fff; transform: rotate(-1.5deg); }
  .cta .big { font-size: calc(5.6 * var(--u)); line-height: 1.3; }
  .cta .sub { font-size: calc(3.4 * var(--u)); font-weight: 700; margin-top: calc(1.6 * var(--u)); line-height: 1.6; }

  /* ---- 開いたときの読み込み画面（増田さん作の loading_only.html を移植。2026-11-01） ----
     ページの上に全画面で重ね、バーが100%になり、かつランキングを読み込めたら消す */
  #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
             justify-content: center; align-items: center; background: #ffffff;
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
             transition: opacity .5s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  .loading-title { font-size: 20px; font-weight: 700; color: #1e3a8a; margin-bottom: 110px; }
  .progress-container { position: relative; width: 80%; max-width: 360px; height: 14px;
                        background: #e5e7eb; border-radius: 7px; }
  .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb);
                  border-radius: 7px; transition: width 0.35s ease-out; }
  .runner { position: absolute; bottom: 11px; left: 0%; transform: translateX(-50%); width: 72px;
            transition: left 0.35s ease-out; pointer-events: none; }
  .runner img { display: block; width: 100%; height: auto; }
  .runner::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 70%; height: 6px;
                   transform: translateX(-50%); z-index: -1;
                   background: radial-gradient(ellipse at center, rgba(15,23,42,0.28), rgba(15,23,42,0) 70%); }
  .percent { margin-top: 14px; font-size: 14px; font-weight: 600; color: #2563eb; }

  .foot { margin-top: calc(4 * var(--u)); font-size: calc(3 * var(--u)); font-weight: 700; color: var(--ink); text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="loading" role="status" aria-label="読み込み中">
  <div class="loading-title">走れ！だいごくん 読み込み中...</div>
  <div class="progress-container">
    <div class="runner" id="runner"><img src="runner.gif" alt="走るキャラクター"></div>
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="percent" id="percent">0%</div>
</div>
<main class="rk">
  <div class="top">
    <h1 class="title"><em>かっこよさ</em> ランキング</h1>
    <div class="line"></div>
    <div class="meta" id="meta">読み込み中…</div>
  </div>
  <div class="win" id="list"></div>
  <div class="side">
    <div class="card cta">
      <div class="big">あなたも走って<br>ランキングに挑戦！</div>
      <div class="sub">走るだけで、AIがあなたの走りの「かっこよさ」を採点します。</div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</main>
<script>
  // data.json は会場のPC（pair_app/github_pages/pages_sync.py）が、ランキングが変わるたびに送ってくる。
  // 載っているのは「掲載を希望した人」のニックネームと点数だけ。
  const NEW_SEC = 300;      // 測定からこの秒数のあいだ NEW（大画面は180秒。こちらは反映が1〜2分遅れるので長め）
  const POLL_MS = 60000;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const clamp = x => Math.max(0, Math.min(100, x));
  // 測定ランチャーと同じ区切り（40/60/80）
  const tier = s => s < 40 ? "#acb5cf" : s < 60 ? "#5bbde5" : s < 80 ? "#9cc715" : "#f4a000";
  const todayJST = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
  const hm = t => new Date(t * 1000).toLocaleTimeString("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit" });

  function render(d) {
    const now = Date.now() / 1000;
    const entries = d.entries;              // 全日程を通したランキング（日付が変わっても消さない）
    const [y, m, day] = todayJST().split("-").map(Number);
    document.getElementById("meta").innerHTML =
      `${m}月${day}日　挑戦者 <b>${d.n_total}</b> 人<small>掲載を希望した人だけを表示しています</small>`;

    document.getElementById("list").innerHTML = entries.length
      ? `<div class="list">${entries.map(e => {
          const top = e.rank <= 3, isNew = now - e.measured_at < NEW_SEC;
          const cls = ["row", top ? "top3 r" + e.rank : "", isNew ? "new" : ""].join(" ");
          return `<div class="${cls}"><div class="badge">${e.rank}</div>
            <div class="name"><span>${esc(e.nickname)}</span>${isNew ? '<span class="newtag">NEW</span>' : ""}</div>
            <div class="score">${e.score.toFixed(1)}<small>点</small></div>
            <div class="bar"><i style="width:${clamp(e.score).toFixed(0)}%;background:${tier(e.score)}"></i></div></div>`;
        }).join("")}</div>`
      : `<div class="empty">まだ挑戦者はいません<br>あなたが1人目になろう！<span>受付で「ランキングにのせる」を選ぶと、ここに名前が出ます</span></div>`;

    document.getElementById("foot").textContent =
      `${hm(d.generated_at)} 時点のランキング`;
  }

  async function load() {
    try {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) render(await r.json());
    } catch (e) { /* 通信が切れたときは前の表示のまま、次の回にまた読む */ }
  }

  // ---- 開いたときの読み込み画面（最初の1回だけ。1分ごとの更新では出さない）----
  // 約3秒で0→100%。ランキングの読み込みが終わっていなければ 90% で待ち、終わったら100%にして消す。
  // 通信がとても遅いときでも、8秒たったら消してページを見せる。
  const LOADING_MS = 3000, LOADING_GIVEUP_MS = 8000;
  function showLoadingThen(firstLoad) {
    const bar = document.getElementById("progressBar"), runner = document.getElementById("runner"),
          pct = document.getElementById("percent"), box = document.getElementById("loading");
    const set = p => { bar.style.width = runner.style.left = p + "%"; pct.textContent = Math.floor(p) + "%"; };
    let progress = 0, ready = false, finished = false;
    const t0 = Date.now(), step = 120, avg = 100 / (LOADING_MS / step);
    firstLoad.finally(() => { ready = true; });
    const timer = setInterval(() => {
      const giveUp = Date.now() - t0 > LOADING_GIVEUP_MS;
      progress = Math.min(ready || giveUp ? 100 : 90, progress + avg * (0.5 + Math.random()));
      set(progress);
      if (progress >= 100 && !finished) {
        finished = true; clearInterval(timer);
        setTimeout(() => { box.classList.add("done"); setTimeout(() => box.remove(), 600); }, 400);
      }
    }, step);
  }
  showLoadingThen(load());
  setInterval(load, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
